[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "coppermesh"
version = "0.1.0"
description = "Experimental CDT + Delaunay refinement mesher for Coppernicus"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["numpy"]

[tool.maturin]
features = ["python"]
module-name = "coppermesh"
