[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "coppermesh"
version = "0.1.0"
description = "Experimental CDT + Delaunay refinement mesher for Coppernicus"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["numpy"]

[project.urls]
Source = "https://github.com/RaffaeleBiondi/Coppernicus"

[tool.maturin]
features = ["python"]
module-name = "coppermesh"

# uv rebuilds a path dependency only when one of these files changes (by default only
# pyproject.toml): the Rust sources too, so that `uv sync --group rust` never keeps a stale build.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "src/**/*.rs" }]
