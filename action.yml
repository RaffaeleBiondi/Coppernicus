name: Coppernicus PDN check
description: >-
  DC power integrity of KiCad boards: solve the rails of Coppernicus project files (voltage drop,
  current density, via currents), publish maps and an HTML report, and fail on an exceeded limit.
author: RaffaeleBiondi
branding:
  icon: zap
  color: orange

inputs:
  project:
    description: >-
      Project file(s) to solve: a path or a glob of *.coppernicus.yml, relative to the repository
      root. Several patterns go on separate lines.
    required: true
  output-dir:
    description: Folder for the results (maps, HTML reports, JSON), relative to the repository root.
    default: coppernicus-results
  html:
    description: Also write the interactive offline HTML report of each project.
    default: "true"
  top:
    description: Current-crowding spots and vias listed per rail (every load is always listed).
    default: "5"
  fail-on-limit:
    description: >-
      Fail the step when a limit written in a project file is exceeded. Errors (a project that
      cannot be solved) always fail it.
    default: "true"
  fail-on-not-judged:
    description: >-
      Fail the step when a limit written in a project file could not judge something (a % limit
      on a 0 V net, a limit of the wrong kind, a rail not solved; listed as NOT JUDGED in the
      summary). false: report it in the job summary only. Without any limit, nothing fails.
    default: "true"
  tree:
    description: >-
      Also solve each project's whole power tree and add its VRM and load tables to the job
      summary. The tree's verdict is shown there; it does not set the exit code.
    default: "false"
  python-version:
    description: Python used to run Coppernicus (3.12 or 3.13).
    default: "3.12"
  uv-version:
    description: uv version to install; empty for the latest.
    default: ""
  upload-artifact:
    description: Upload the results folder as a workflow artifact.
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact.
    default: coppernicus-results

outputs:
  verdict:
    description: >-
      pass, fail, not_judged, pass_partially_judged or error, over every project. Judged only
      against the limits written in the project files.
    value: ${{ steps.solve.outputs.verdict }}
  exit-code:
    description: >-
      0 (no limit exceeded, or none set), 1 (a limit exceeded), 3 (a limit that was set could not
      judge something) or 2 (an error). Precedence 2, 1, 3, 0.
    value: ${{ steps.solve.outputs.exit-code }}
  results-dir:
    description: Absolute path of the results folder.
    value: ${{ steps.solve.outputs.results-dir }}
  artifact-url:
    description: Download URL of the uploaded results, when uploaded.
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@v10.4.0
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        working-directory: ${{ github.action_path }}
        enable-cache: true

    - name: Install Coppernicus
      shell: bash
      run: uv sync --project "$GITHUB_ACTION_PATH" --frozen --no-dev

    - name: Solve the rails
      id: solve
      shell: bash
      env:
        COPPERNICUS_PROJECTS: ${{ inputs.project }}
        COPPERNICUS_OUT: ${{ inputs.output-dir }}
        COPPERNICUS_TOP: ${{ inputs.top }}
        COPPERNICUS_HTML: ${{ inputs.html }}
        COPPERNICUS_TREE: ${{ inputs.tree }}
      run: |
        # The results go to their own folder; nothing is written next to a board and nothing
        # is committed.
        html_flag=""
        if [ "$COPPERNICUS_HTML" != "true" ]; then html_flag="--no-html"; fi
        tree_flag=""
        if [ "$COPPERNICUS_TREE" = "true" ]; then tree_flag="--tree"; fi
        index="$COPPERNICUS_OUT/coppernicus-ci.json"
        rm -f "$index"
        uv run --project "$GITHUB_ACTION_PATH" --frozen --no-dev python -m coppernicus.ci solve \
          --out "$COPPERNICUS_OUT" --top "$COPPERNICUS_TOP" $html_flag $tree_flag "$COPPERNICUS_PROJECTS" || true
        # The exit code and verdict come from the index the helper writes: a crash also exits
        # with 1, which must not read as "limit exceeded". No index means an error.
        result=$(uv run --project "$GITHUB_ACTION_PATH" --frozen --no-dev python -c \
          "import json, sys; d = json.load(open(sys.argv[1], encoding='utf-8')); print(d['exit_code'], d['verdict'])" \
          "$index" 2>/dev/null) || result="2 error"
        code=${result%% *}
        verdict=${result##* }
        {
          echo "exit-code=$code"
          echo "verdict=$verdict"
          echo "results-dir=$(cd "$COPPERNICUS_OUT" 2>/dev/null && pwd || echo "$COPPERNICUS_OUT")"
        } >> "$GITHUB_OUTPUT"

    - name: Upload the results
      id: upload
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-dir }}
        if-no-files-found: warn

    - name: Write the job summary
      if: always()
      shell: bash
      env:
        COPPERNICUS_OUT: ${{ inputs.output-dir }}
        COPPERNICUS_TOP: ${{ inputs.top }}
        COPPERNICUS_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
      run: |
        uv run --project "$GITHUB_ACTION_PATH" --frozen --no-dev python -m coppernicus.ci summary \
          --out "$COPPERNICUS_OUT" --top "$COPPERNICUS_TOP" --artifact-url "$COPPERNICUS_ARTIFACT_URL" \
          >> "$GITHUB_STEP_SUMMARY" \
          || printf '## Coppernicus: DC power integrity\n\n**Error:** no results; see the job log.\n' \
          >> "$GITHUB_STEP_SUMMARY"

    - name: Verdict
      if: always()
      shell: bash
      env:
        CODE: ${{ steps.solve.outputs.exit-code }}
        FAIL_ON_LIMIT: ${{ inputs.fail-on-limit }}
        FAIL_ON_NOT_JUDGED: ${{ inputs.fail-on-not-judged }}
      run: |
        case "$CODE" in
          0) echo "Coppernicus: no limit exceeded." ;;
          1) if [ "$FAIL_ON_LIMIT" = "true" ]; then
               echo "::error title=Coppernicus::A limit set in a project file is exceeded. See the job summary."
               exit 1
             fi
             echo "::warning title=Coppernicus::A limit set in a project file is exceeded (fail-on-limit is false)." ;;
          3) if [ "$FAIL_ON_NOT_JUDGED" = "true" ]; then
               echo "::error title=Coppernicus::A limit set in a project file could not judge something (NOT JUDGED). See the job summary."
               exit 1
             fi
             echo "::warning title=Coppernicus::A limit set in a project file could not judge something (fail-on-not-judged is false)." ;;
          *) echo "::error title=Coppernicus::A project could not be solved (exit code ${CODE:-none}). See the log above."
             exit 2 ;;
        esac
