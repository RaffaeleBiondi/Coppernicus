name: Release builds

# The packaged app: a macOS disk image (Apple silicon) and a Windows zip, kept as workflow
# artifacts. Nothing is published: no GitHub release is created here. The bundles hold
# everything except the Triangle mesher, which the app downloads on its first start
# (docs/install.md); packaging/check_bundle.py fails the build if triangle got in.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS app (arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Build Coppernicus.app and the .dmg
        run: packaging/build_macos.sh
      - name: The packaged command line starts
        run: dist/Coppernicus.app/Contents/MacOS/Coppernicus --version
      - uses: actions/upload-artifact@v7
        with:
          name: coppernicus-macos-arm64
          path: |
            dist/*.dmg
            dist/*-contents.txt
          if-no-files-found: error

  windows:
    name: Windows app (x64, untested on a real machine)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Build the Coppernicus folder and the .zip
        shell: pwsh
        run: packaging\build_windows.ps1
      - name: The packaged command line starts
        shell: pwsh
        run: |
          dist\Coppernicus\coppernicus-cli.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: coppernicus-windows-x64
          path: |
            dist/*.zip
            dist/*-contents.txt
          if-no-files-found: error
