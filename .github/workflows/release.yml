name: Release builds

# The packaged app: a macOS disk image (Apple silicon) and a Windows zip, kept as workflow
# artifacts. Nothing is published: no GitHub release is created here. The bundles hold
# everything except the Triangle mesher, which the app downloads only when it is chosen
# (docs/install.md); packaging/check_bundle.py fails the build if triangle got in. They hold
# coppermesh, the rust mesher (the default one), built from tools/mesher_rs with the runner's
# Rust toolchain; check_bundle.py fails the build without it or without the licences of the Rust
# crates it is built from in THIRD_PARTY_NOTICES.txt, tools/mesher_rs/check_fma.py on a fused
# multiply-add in it. A manual run (workflow_dispatch, on any branch) builds and uploads the same
# artifacts, and publishes nothing either.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS app (arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      # coppermesh is built from source (the build script syncs uv's "rust" group before
      # PyInstaller); llvm-tools gives check_fma.py its llvm-objdump.
      - name: Rust toolchain (stable, through the runner's rustup) with llvm-tools
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools
          rustup default stable
          rustc -vV
      - name: Build Coppernicus.app and the .dmg
        run: packaging/build_macos.sh
      - name: The packaged command line starts
        run: dist/Coppernicus.app/Contents/MacOS/Coppernicus --version
      - name: First start (the rust mesher, nothing downloaded) and the example's power tree
        env:
          COPPERNICUS_SITE_PACKAGES: ${{ runner.temp }}/coppernicus-site-packages
        run: |
          cp -R examples "$RUNNER_TEMP/examples"
          dist/Coppernicus.app/Contents/MacOS/Coppernicus solve \
            "$RUNNER_TEMP/examples/power_chain/power_chain.coppernicus.yml" --tree --html
          test ! -e "$COPPERNICUS_SITE_PACKAGES/triangle"
      - name: Triangle on demand (--mesher triangle fetches it from PyPI), the power tree again
        env:
          COPPERNICUS_SITE_PACKAGES: ${{ runner.temp }}/coppernicus-site-packages
        run: |
          dist/Coppernicus.app/Contents/MacOS/Coppernicus solve \
            "$RUNNER_TEMP/examples/power_chain/power_chain.coppernicus.yml" --tree --mesher triangle \
            --out "$RUNNER_TEMP/smoke/triangle"
          test -d "$COPPERNICUS_SITE_PACKAGES/triangle"
      # The other solves on the same copy of the examples, each with its HTML page: the exit
      # code is checked (some variants fail on purpose), then the files written.
      - name: "ac: the PDN example's impedance (pdn-relaxed: the target holds, exit 0)"
        timeout-minutes: 10
        env:
          COPPERNICUS_SITE_PACKAGES: ${{ runner.temp }}/coppernicus-site-packages
        run: |
          out="$RUNNER_TEMP/smoke/ac"
          code=0
          dist/Coppernicus.app/Contents/MacOS/Coppernicus ac \
            "$RUNNER_TEMP/examples/pdn/pdn-relaxed.coppernicus.yml" --out "$out" --html || code=$?
          echo "exit code $code (expected 0)"
          test "$code" -eq 0
          ls "$out"/*_ac_report.html "$out"/*_ac_summary.json "$out"/*_impedance.csv "$out"/*_impedance.png
      - name: "noise: the noise example's ripple and coupled noise (passes, exit 0)"
        timeout-minutes: 10
        env:
          COPPERNICUS_SITE_PACKAGES: ${{ runner.temp }}/coppernicus-site-packages
        run: |
          out="$RUNNER_TEMP/smoke/noise"
          code=0
          dist/Coppernicus.app/Contents/MacOS/Coppernicus noise \
            "$RUNNER_TEMP/examples/noise/noise.coppernicus.yml" --out "$out" --html || code=$?
          echo "exit code $code (expected 0)"
          test "$code" -eq 0
          ls "$out"/*_noise_report.html "$out"/*_noise_summary.json "$out"/*_noise.csv "$out"/*_noise.png
      - name: "tolerance: the tolerance example's stack-up (passes, exit 0)"
        timeout-minutes: 10
        env:
          COPPERNICUS_SITE_PACKAGES: ${{ runner.temp }}/coppernicus-site-packages
        run: |
          out="$RUNNER_TEMP/smoke/tolerance"
          code=0
          dist/Coppernicus.app/Contents/MacOS/Coppernicus tolerance \
            "$RUNNER_TEMP/examples/tolerance/tolerance.coppernicus.yml" --out "$out" --html || code=$?
          echo "exit code $code (expected 0)"
          test "$code" -eq 0
          ls "$out"/*_tolerance_report.html "$out"/*_tolerance_summary.json "$out"/*_tolerance.csv
      - name: "solve --thermal: the demo's board temperature (over max_rise_c on purpose, exit 1)"
        timeout-minutes: 10
        env:
          COPPERNICUS_SITE_PACKAGES: ${{ runner.temp }}/coppernicus-site-packages
        run: |
          out="$RUNNER_TEMP/smoke/thermal"
          code=0
          dist/Coppernicus.app/Contents/MacOS/Coppernicus solve \
            "$RUNNER_TEMP/examples/demo/demo-thermal.coppernicus.yml" --thermal --out "$out" --html || code=$?
          echo "exit code $code (expected 1)"
          test "$code" -eq 1
          ls "$out"/*_tree_report.html "$out"/*_tree_summary.json "$out"/*_temperature_F.Cu.png
      - uses: actions/upload-artifact@v7
        with:
          name: coppernicus-macos-arm64
          path: |
            dist/*.dmg
            dist/*-contents.txt
          if-no-files-found: error

  windows:
    name: Windows app (x64, untested on a real machine)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      # coppermesh is built from source with the MSVC toolchain (the runner has the Visual Studio
      # build tools); llvm-tools gives check_fma.py its llvm-objdump for the .pyd.
      - name: Rust toolchain (stable, MSVC, through the runner's rustup) with llvm-tools
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component llvm-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc -vV
      - name: Build the Coppernicus folder and the .zip
        shell: pwsh
        run: packaging\build_windows.ps1
      - name: The packaged command line starts
        shell: pwsh
        run: |
          dist\Coppernicus\coppernicus-cli.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: First start (the rust mesher, nothing downloaded) and the example's power tree
        shell: pwsh
        env:
          COPPERNICUS_SITE_PACKAGES: ${{ runner.temp }}\coppernicus-site-packages
        run: |
          Copy-Item -Recurse examples "$env:RUNNER_TEMP\examples"
          dist\Coppernicus\coppernicus-cli.exe solve "$env:RUNNER_TEMP\examples\power_chain\power_chain.coppernicus.yml" --tree --html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path "$env:COPPERNICUS_SITE_PACKAGES\triangle") { throw "Triangle was downloaded at the start" }
      - name: Triangle on demand (--mesher triangle fetches it from PyPI), the power tree again
        shell: pwsh
        env:
          COPPERNICUS_SITE_PACKAGES: ${{ runner.temp }}\coppernicus-site-packages
        run: |
          dist\Coppernicus\coppernicus-cli.exe solve "$env:RUNNER_TEMP\examples\power_chain\power_chain.coppernicus.yml" --tree --mesher triangle --out "$env:RUNNER_TEMP\smoke\triangle"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:COPPERNICUS_SITE_PACKAGES\triangle")) { throw "Triangle was not downloaded" }
      # The other solves on the same copy of the examples, each with its HTML page: the exit
      # code is checked (some variants fail on purpose), then the files written. Each script
      # ends with exit 0: GitHub appends "exit $LASTEXITCODE", the exe's own code.
      - name: "ac: the PDN example's impedance (pdn-relaxed: the target holds, exit 0)"
        shell: pwsh
        timeout-minutes: 10
        env:
          COPPERNICUS_SITE_PACKAGES: ${{ runner.temp }}\coppernicus-site-packages
        run: |
          $out = "$env:RUNNER_TEMP\smoke\ac"
          dist\Coppernicus\coppernicus-cli.exe ac "$env:RUNNER_TEMP\examples\pdn\pdn-relaxed.coppernicus.yml" --out $out --html
          $code = $LASTEXITCODE
          Write-Output "exit code $code (expected 0)"
          if ($code -ne 0) { exit 1 }
          foreach ($f in "*_ac_report.html", "*_ac_summary.json", "*_impedance.csv", "*_impedance.png") {
            if (-not (Test-Path (Join-Path $out $f))) { Write-Output "missing: $out\$f"; exit 1 }
          }
          exit 0
      - name: "noise: the noise example's ripple and coupled noise (passes, exit 0)"
        shell: pwsh
        timeout-minutes: 10
        env:
          COPPERNICUS_SITE_PACKAGES: ${{ runner.temp }}\coppernicus-site-packages
        run: |
          $out = "$env:RUNNER_TEMP\smoke\noise"
          dist\Coppernicus\coppernicus-cli.exe noise "$env:RUNNER_TEMP\examples\noise\noise.coppernicus.yml" --out $out --html
          $code = $LASTEXITCODE
          Write-Output "exit code $code (expected 0)"
          if ($code -ne 0) { exit 1 }
          foreach ($f in "*_noise_report.html", "*_noise_summary.json", "*_noise.csv", "*_noise.png") {
            if (-not (Test-Path (Join-Path $out $f))) { Write-Output "missing: $out\$f"; exit 1 }
          }
          exit 0
      - name: "tolerance: the tolerance example's stack-up (passes, exit 0)"
        shell: pwsh
        timeout-minutes: 10
        env:
          COPPERNICUS_SITE_PACKAGES: ${{ runner.temp }}\coppernicus-site-packages
        run: |
          $out = "$env:RUNNER_TEMP\smoke\tolerance"
          dist\Coppernicus\coppernicus-cli.exe tolerance "$env:RUNNER_TEMP\examples\tolerance\tolerance.coppernicus.yml" --out $out --html
          $code = $LASTEXITCODE
          Write-Output "exit code $code (expected 0)"
          if ($code -ne 0) { exit 1 }
          foreach ($f in "*_tolerance_report.html", "*_tolerance_summary.json", "*_tolerance.csv") {
            if (-not (Test-Path (Join-Path $out $f))) { Write-Output "missing: $out\$f"; exit 1 }
          }
          exit 0
      - name: "solve --thermal: the demo's board temperature (over max_rise_c on purpose, exit 1)"
        shell: pwsh
        timeout-minutes: 10
        env:
          COPPERNICUS_SITE_PACKAGES: ${{ runner.temp }}\coppernicus-site-packages
        run: |
          $out = "$env:RUNNER_TEMP\smoke\thermal"
          $PSNativeCommandUseErrorActionPreference = $false   # the exit 1 is checked below, not thrown
          dist\Coppernicus\coppernicus-cli.exe solve "$env:RUNNER_TEMP\examples\demo\demo-thermal.coppernicus.yml" --thermal --out $out --html
          $code = $LASTEXITCODE
          Write-Output "exit code $code (expected 1)"
          if ($code -ne 1) { exit 1 }
          foreach ($f in "*_tree_report.html", "*_tree_summary.json", "*_temperature_F.Cu.png") {
            if (-not (Test-Path (Join-Path $out $f))) { Write-Output "missing: $out\$f"; exit 1 }
          }
          exit 0
      - uses: actions/upload-artifact@v7
        with:
          name: coppernicus-windows-x64
          path: |
            dist/*.zip
            dist/*-contents.txt
          if-no-files-found: error
