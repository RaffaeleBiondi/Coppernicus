name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen      # the GUI tests import Qt and VTK; no display on runners
  # The rust mesher (coppermesh): uv.lock names PyPI's wheel, which users get (the job
  # pypi-wheel tests it). The pytest jobs test this repository's tools/mesher_rs instead: the sync
  # leaves PyPI's coppermesh out, maturin builds it from source (every hosted runner has a Rust
  # toolchain), check_source.py proves which one is installed, and every later `uv run` is
  # --no-sync (a sync would put the wheel back, silently: both are coppermesh 0.1.0). Its tests
  # skip where the extension is missing: this makes a missing or broken build fail them instead.
  COPPERNICUS_REQUIRE_RUST: "1"

jobs:
  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for Qt and VTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Rust toolchain (preinstalled) and its llvm-objdump
        shell: bash
        run: |
          rustup show active-toolchain
          rustc --version
          rustup component add llvm-tools
      - name: coppermesh core tests (cargo)
        working-directory: tools/mesher_rs
        run: cargo test --release
      - name: Install, without PyPI's coppermesh
        run: uv sync --frozen --no-install-package coppermesh
      - name: coppermesh built from tools/mesher_rs by maturin, and the proof that it is installed
        shell: bash               # stops at the first failing command on every runner (not so pwsh)
        run: |
          uv pip install --python .venv ./tools/mesher_rs
          uv run --no-sync python tools/mesher_rs/check_source.py
      - name: No fused multiply-add in the built extension, and the recorded mesh bit for bit
        shell: bash
        run: |
          uv run --no-sync python tools/mesher_rs/check_fma.py
          uv run --no-sync python tools/mesher_rs/check_digest.py
      - name: Lint
        if: runner.os == 'Linux'
        run: uv run --no-sync ruff check src tests examples tools
      - name: Tests (the boards_local test skips by itself; the rust cases must not)
        run: uv run --no-sync pytest -q

  # Intel macOS: Triangle publishes no x86_64 macOS wheel (and no sdist) for the version uv.lock
  # pins, so the project cannot be installed here and pytest cannot run. What can: the core's
  # cargo tests, the wheel maturin builds, and its FMA and mesh-digest checks.
  mesher-macos-x86_64:
    name: coppermesh (macos-15-intel)
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Rust toolchain (preinstalled) and its llvm-objdump
        run: |
          rustc -vV
          rustup component add llvm-tools
      - name: coppermesh core tests (cargo)
        working-directory: tools/mesher_rs
        run: cargo test --release
      - name: Build the abi3 wheel
        working-directory: tools/mesher_rs
        run: uvx --from 'maturin>=1.7,<2' maturin build --release --out "$RUNNER_TEMP/wheels"
      - name: Install it; no fused multiply-add, and the recorded mesh bit for bit
        run: |
          uv venv "$RUNNER_TEMP/venv" --python 3.12
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP"/wheels/coppermesh-*.whl
          "$RUNNER_TEMP/venv/bin/python" tools/mesher_rs/check_fma.py
          "$RUNNER_TEMP/venv/bin/python" tools/mesher_rs/check_digest.py

  # The install users get (a plain `uv sync`, as `uv tool install git+...` and the Action do):
  # coppermesh from PyPI's wheel, with no Rust. --no-build-package makes uv refuse to build it
  # (the runner has cargo), check_source.py --pypi proves the wheel is what is installed. Its
  # FMA and digest checks, the mesher tests and a CLI solve of the demo with rust, the default.
  pypi-wheel:
    name: coppermesh from PyPI's wheel (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 40                 # every job's (tests/test_workflows.py); it takes minutes
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for Qt and VTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install as users do, coppermesh never built from source
        run: uv sync --frozen --no-build-package coppermesh
      - name: Guard (PyPI's wheel installed, rust the default mesher)
        run: |
          uv run --frozen python tools/mesher_rs/check_source.py --pypi
          uv run --frozen python - <<'PY'
          from coppernicus.engine.meshing import session
          assert session.choose() == ("rust", None), session.choose()
          print("the default mesher, rust, runs here")
          PY
      - name: No fused multiply-add in the wheel, and the recorded mesh bit for bit
        run: |
          uv run --frozen python tools/mesher_rs/check_fma.py
          uv run --frozen python tools/mesher_rs/check_digest.py
      - name: The mesher tests on the wheel
        run: >
          uv run --frozen pytest -q -rs
          tests/test_meshing_seam.py
          tests/test_mesher_rs.py
          tests/test_meshing_default.py
          tests/test_mesher_sliver.py
          tests/test_mesher_selector.py
      - name: A CLI solve of the demo meshes with rust
        run: |
          set +e
          uv run --frozen coppernicus solve examples/demo/demo.coppernicus.yml --json --no-maps \
            --out "$RUNNER_TEMP/demo" > "$RUNNER_TEMP/demo.json"
          code=$?
          set -e
          test "$code" -le 1
          uv run --frozen python - "$RUNNER_TEMP/demo.json" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          assert doc["mesher"]["name"] == "rust" and "fallback_from" not in doc["mesher"], doc["mesher"]
          print("mesher:", doc["mesher"])
          PY

  # An install without coppermesh (removed from the environment, or a platform it has no wheel
  # for): coppermesh really missing. A solve that names no mesher must mesh with Triangle and
  # say so; one that names rust must stop with mesher_unavailable. Cheap: the selector and
  # fallback tests and one CLI solve of the demo.
  no-rust:
    name: without the rust mesher (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 40                 # every job's (tests/test_workflows.py); it takes minutes
    env:
      COPPERNICUS_REQUIRE_RUST: ""        # the rust cases skip here: coppermesh is left out
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for Qt and VTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install without coppermesh
        run: uv sync --frozen --no-install-package coppermesh
      - name: Guard (coppermesh absent)
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("coppermesh") is None, "coppermesh is installed"
          from coppernicus.engine.meshing import session
          assert session.choose() == ("triangle", session.FALLBACK_WARNING), session.choose()
          print("coppermesh absent: the default falls back to Triangle")
          PY
      - name: Selector and fallback tests
        run: .venv/bin/python -m pytest -q -rs tests/test_mesher_fallback.py tests/test_mesher_selector.py
      - name: A CLI solve of the demo falls back with its warning; --mesher rust is an error
        run: |
          set +e
          .venv/bin/coppernicus solve examples/demo/demo.coppernicus.yml --json --no-maps \
            --out "$RUNNER_TEMP/demo" > "$RUNNER_TEMP/demo.json"
          code=$?
          .venv/bin/coppernicus solve examples/demo/demo.coppernicus.yml --json --no-maps \
            --mesher rust --out "$RUNNER_TEMP/rust" > "$RUNNER_TEMP/rust.json"
          rust=$?
          set -e
          test "$code" -le 1 && test "$rust" -eq 2
          .venv/bin/python - "$RUNNER_TEMP/demo.json" "$RUNNER_TEMP/rust.json" <<'PY'
          import json, sys
          from coppernicus.engine.meshing.session import FALLBACK_WARNING
          doc, err = (json.load(open(p, encoding="utf-8")) for p in sys.argv[1:])
          assert doc["mesher"]["name"] == "triangle" and doc["mesher"]["fallback_from"] == "rust", doc["mesher"]
          assert FALLBACK_WARNING in doc["warnings"], doc["warnings"]
          assert err["error"]["code"] == "mesher_unavailable", err
          print("fallback:", doc["mesher"], "| --mesher rust:", err["error"]["code"])
          PY
